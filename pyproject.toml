[project]
name = "pulse-wiki"
version = "0.1.0"
description = "Self-updating technical wiki from GitHub, Slack, Linear, and local files"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "anthropic>=0.40.0",
    "fastmcp>=2.0.0",
    "python-frontmatter>=1.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.27.0",
    "slack-sdk>=3.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
