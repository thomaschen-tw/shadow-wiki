name: Daily Knowledge Digest

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 10:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:        # manual trigger from GitHub UI → Actions tab

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: self-hosted    # your Mac with access to local knowledge_base
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Late startup detection & compensation
        run: |
          echo "=== Digest Startup Check (Shanghai Time) ==="
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Last digest commit:"
          git log --grep="daily knowledge digest" --oneline -1 || echo "  (none in history)"
          echo ""
          echo "If runner was offline at 10:00 Shanghai, manually trigger via GitHub UI → Actions → Run workflow"

      - name: Verify environment
        run: uv run python test_env.py || true   # warn but never fail the job

      - name: Initialise database
        run: uv run python scripts/resource_mgr.py init

      - name: Scan knowledge_base for new / changed notes
        run: uv run python scripts/ingest/knowledge_base_scanner.py --once

      - name: Show pending events before ETL
        run: uv run python scripts/resource_mgr.py status

      - name: Distill notes into wiki pages
        env:
          USE_CLOUD_LLM: "true"
          PIPELINE_MODE: "etl"
          WIKI_WRITE_TARGET: "etl"
        run: |
          uv run python scripts/resource_mgr.py etl-run all --apply --limit 200
      
      - name: Hardening Retention (Archive & Purge Staging Rows)
        run: |
          uv run python scripts/resource_mgr.py etl-archive --hours 24 --apply

      - name: Commit and push wiki updates
        run: |
          git config user.email "pulse-wiki[bot]@users.noreply.github.com"
          git config user.name "PulseWiki Bot"
          git add wiki_content/
          git diff --staged --quiet \
            && echo "No wiki changes today." \
            || (git commit -m "docs: daily knowledge digest $(date +%Y-%m-%d)" && git push)

      - name: Final status
        run: |
          uv run python scripts/resource_mgr.py status
          uv run python scripts/resource_mgr.py list
