name: Regression Guard

on:
  pull_request:
  push:
    branches: [main, test]

jobs:
  p0-etl:
    name: P0 ETL Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run P0 ETL tests
        run: uv run pytest -q -m p0 --maxfail=1

  full-regression:
    name: Full Regression
    runs-on: ubuntu-latest
    needs: p0-etl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run full regression triage
        run: uv run python scripts/qa/full_regression_triage.py

      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-triage-report
          path: artifacts/regression/
